const hue=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return 250+h%60};
const initials=n=>String(n||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase()||"?";
function av(name,url,size=44){
 const s=`width:${size}px;height:${size}px;font-size:${Math.round(size*.38)}px`,u=safeUrl(url);
 return u?`<span class="av" style="${s}"><img src="${esc(u)}" alt="" loading="lazy"></span>`
  :`<span class="av" style="${s};background:linear-gradient(135deg,hsl(${hue(name)} 60% 44%),hsl(${hue(name)+30} 65% 58%))">${esc(initials(name))}</span>`;
}
const badge=b=>b==="mentor"?'<span class="bdg mentor">Mentor</span>':b==="org"?'<span class="bdg org">Org Team</span>':"";
const tags=(a,n=99)=>(a||[]).slice(0,n).map(t=>`<span class="tag">${esc(t)}</span>`).join("");
const sk=(n=3,h=120)=>`<div class="grid">${Array.from({length:n},()=>`<div class="sk" style="height:${h}px"></div>`).join("")}</div>`;
const empty=(t,d,btn)=>`<div class="empty"><b>${esc(t)}</b>${esc(d||"")}${btn||""}</div>`;
let toastT;function toast(m,bad){const t=$("#toast");t.textContent=m;t.className="show"+(bad?" bad":"");clearTimeout(toastT);toastT=setTimeout(()=>{t.className=""},3200)}
function sheet(html){$("#sheet").innerHTML=html;$("#mod").hidden=false;document.body.style.overflow="hidden"}
function closeSheet(){$("#mod").hidden=true;$("#sheet").innerHTML="";document.body.style.overflow=""}
async function decodeImg(file){
 try{return await createImageBitmap(file)}catch(e){}
 return await new Promise((res,rej)=>{const u=URL.createObjectURL(file),i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error("Rasmni o‘qib bo‘lmadi"));i.src=u});
}
async function resizeJpeg(file,max=1400,q=.85){
 const im=await decodeImg(file),w=im.width||im.naturalWidth,h=im.height||im.naturalHeight,k=Math.min(1,max/Math.max(w,h));
 const c=document.createElement("canvas");c.width=Math.round(w*k);c.height=Math.round(h*k);
 const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
 return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error("Rasm tayyorlanmadi")),"image/jpeg",q));
}
const withTimeout=(p,ms=20000)=>Promise.race([p,new Promise((_,j)=>setTimeout(()=>j(new Error("Server javob bermadi. Internetni tekshiring.")),ms))]);

const TI={interests:[],skills:[],goals:[]};
function tiSugHtml(k){

 return list.filter(x=>!TI[k].some(y=>y.toLowerCase()===x.toLowerCase())&&(!q||x.toLowerCase().includes(q))).slice(0,q?6:8)
  .map(x=>`<button type="button" class="tag gl" data-act="tiadd" data-k="${k}" data-id="${esc(x)}">+ ${esc(x)}</button>`).join("");
}

 const lim=k==="goals"?6:10;
 if(k==="goals"){box.innerHTML=`<div class="tags">${GOALS.map(g=>`<button type="button" class="tag ${TI.goals.includes(g)?"on":"gl"}" data-act="tipick" data-k="goals" data-id="${esc(g)}">${esc(g)}</button>`).join("")}</div><div class="hint">${TI.goals.length}/${lim}</div>`;return}

/* ---------- avatar kesish (crop) ---------- */
async function openCrop(file){
 if(!/^image\/(jpeg|png|webp)$/.test(file.type)){toast("Faqat JPG, PNG yoki WebP",true);return}
 if(file.size>15*1024*1024){toast("Rasm juda katta (15 MB gacha)",true);return}
 let im;try{im=await decodeImg(file)}catch(e){toast("Rasmni o‘qib bo‘lmadi",true);return}
 const iw=im.width||im.naturalWidth,ih=im.height||im.naturalHeight,S=300;
 AVST={im,iw,ih,S,zoom:1,cx:iw/2,cy:ih/2};
 sheet(`<h3>Profil rasmini sozlang</h3><div class="crop"><canvas id="cc" width="${S}" height="${S}"></canvas></div><div class="fld"><label>Kattalashtirish</label><input type="range" id="cz" min="1" max="3" step="0.01" value="1"></div><p class="hint" style="text-align:center">Rasmni barmoq bilan siljiting</p><div class="row"><button class="btn pri" data-act="cropok" style="flex:1">Tayyor</button><button class="btn line" data-act="close">Bekor qilish</button></div>`);
 cropDraw();
}
function cropClamp(){const a=AVST,s=a.S/Math.min(a.iw,a.ih)*a.zoom,h=a.S/2/s;a.cx=Math.min(Math.max(a.cx,h),a.iw-h);a.cy=Math.min(Math.max(a.cy,h),a.ih-h);return s}
function cropDraw(){
 const a=AVST;if(!a)return;const c=$("#cc");if(!c)return;const s=cropClamp(),x=c.getContext("2d");
 x.fillStyle="#000";x.fillRect(0,0,a.S,a.S);x.drawImage(a.im,a.S/2-a.cx*s,a.S/2-a.cy*s,a.iw*s,a.ih*s);
}
async function cropDone(){
 const a=AVST;if(!a)return;const s=cropClamp(),O=512,f=O/a.S,c=document.createElement("canvas");c.width=c.height=O;
 const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,O,O);x.drawImage(a.im,(a.S/2-a.cx*s)*f,(a.S/2-a.cy*s)*f,a.iw*s*f,a.ih*s*f);
 NEWAV=await new Promise(r=>c.toBlob(r,"image/jpeg",.88));
 if(!NEWAV){toast("Rasm tayyorlanmadi",true);return}
 $("#avp").innerHTML=`<span class="av" style="width:84px;height:84px"><img src="${URL.createObjectURL(NEWAV)}" alt=""></span>`;closeSheet();
}

/* ---------- yutuqlar ---------- */
function achSheet(id){
 const a=ACH.find(x=>x.id===id)||{};ACHFILE=null;
 sheet(`<h3>${a.id?"Yutuqni o‘zgartirish":"Yutuq qo‘shish"}</h3>
 <div class="fld"><label>Turi</label><select id="a-k">${KINDS.map(([k,l])=>`<option value="${k}"${(a.kind||"sertifikat")===k?" selected":""}>${l}</option>`).join("")}</select></div>
 <div class="fld"><label>Nomi</label><input id="a-t" maxlength="120" value="${esc(a.title||"")}" placeholder="Masalan: Debate turniri g‘olibi"></div>
 <div class="two"><div class="fld"><label>Tashkilot</label><input id="a-o" maxlength="120" value="${esc(a.organization||"")}"></div><div class="fld"><label>Yil</label><input id="a-y" inputmode="numeric" maxlength="4" value="${a.year||""}" placeholder="${new Date().getFullYear()}"></div></div>
 <div class="fld"><label>Tavsif (ixtiyoriy)</label><textarea id="a-d" maxlength="600">${esc(a.description||"")}</textarea></div>
 <div class="fld"><label>Rasm yoki sertifikat (ixtiyoriy)</label><button type="button" class="btn line" data-act="achpick">${ic("camera",16)}<span id="a-fn">${a.image_url?"Rasm yuklangan. Almashtirish":"Rasm tanlash"}</span></button></div>
 <div id="a-err" class="hint bad"></div>
 <div class="row" style="margin-top:8px"><button class="btn pri" id="a-save" data-act="achsave" data-id="${a.id||""}" style="flex:1">Saqlash</button>${a.id?`<button class="btn bad" data-act="achdel" data-id="${a.id}">${ic("trash",16)}O‘chirish</button>`:""}<button class="btn line" data-act="close">Yopish</button></div>`);
}
async function achSave(id){
 const err=$("#a-err"),btn=$("#a-save");err.textContent="";
 const title=$("#a-t").value.trim(),yS=$("#a-y").value.trim(),y=yS?parseInt(yS):null;
 if(title.length<2){err.textContent="Yutuq nomini kiriting";return}
 if(yS&&!(y>=1950&&y<=new Date().getFullYear()+1)){err.textContent="Yilni to‘g‘ri kiriting";return}
 btn.disabled=true;btn.textContent="Saqlanmoqda…";
 try{
  const old=ACH.find(x=>x.id===id);let img=old?old.image_url:null;
  if(ACHFILE){
   const blob=await resizeJpeg(ACHFILE),path=`${U.id}/${(crypto.randomUUID?crypto.randomUUID():Date.now())}.jpg`;
   const up=await withTimeout(sb.storage.from("achievements").upload(path,blob,{contentType:"image/jpeg"}));
   if(up.error)throw new Error("Rasm yuklanmadi: "+up.error.message);
   img=sb.storage.from("achievements").getPublicUrl(path).data.publicUrl;
  }
  const row={kind:$("#a-k").value,title,organization:$("#a-o").value.trim()||null,year:y,description:$("#a-d").value.trim()||null,image_url:img};
  const r=id?await sb.from("cn_achievements").update(row).eq("id",id):await sb.from("cn_achievements").insert({...row,user_id:U.id});
  if(r.error)throw r.error;
  await loadMine();closeSheet();toast("Yutuq saqlandi ✓");route();
 }catch(e){err.textContent=(e&&e.message)||String(e);btn.disabled=false;btn.textContent="Saqlash"}
}
async function achDelete(id){
 if(!confirm("Bu yutuq o‘chirilsinmi?"))return;
 const r=await sb.from("cn_achievements").delete().eq("id",id);
 if(r.error){toast(r.error.message,true);return}
 await loadMine();closeSheet();toast("O‘chirildi");route();
}

/* ---------- tanishuv so'rovi ---------- */
function reqSheet(id){
 sheet(`<h3>Tanishish so‘rovi</h3><div class="fld"><label>Qisqa xabar (ixtiyoriy)</label><textarea id="r-m" maxlength="300" placeholder="Salom! Qiziqishlarimiz mos kelgani uchun tanishmoqchi edim."></textarea></div><div id="r-err" class="hint bad"></div>
 <div class="row"><button class="btn pri" id="r-ok" data-act="reqsend" data-id="${esc(id)}" style="flex:1">Yuborish</button><button class="btn line" data-act="close">Bekor qilish</button></div>`);
}
async function reqSend(id){
 const btn=$("#r-ok");btn.disabled=true;
 const r=await sb.rpc("cn_send_request",{p_to:id,p_message:$("#r-m").value.trim()||null});
 if(r.error){$("#r-err").textContent=r.error.message;btn.disabled=false;return}
 closeSheet();toast("So‘rov yuborildi ✓");
 DISC.list.forEach(u=>{if(u.user_id===id)u.rel="sent"});route();
}

/* ---------- harakatlar (event delegation) ---------- */
const ACT={
 go:id=>{location.hash="#"+id},
 back:()=>{history.length>1?history.back():(location.hash="#home")},
 theme:()=>{const d=document.documentElement.dataset.theme==="dark"?"light":"dark";document.documentElement.dataset.theme=d;try{localStorage.setItem("mtheme",d)}catch(e){}paintTop()},
 bell:()=>{location.href="/connect"},
 logout:async()=>{await sb.auth.signOut();location.href="/"},
 close:()=>closeSheet(),
 user:id=>{location.hash="#user/"+id},
 req:id=>reqSheet(id),reqsend:id=>reqSend(id),
 msg:id=>{try{sessionStorage.setItem("cn_open",id)}catch(e){}location.href="/connect"},
 seg:id=>{location.hash="#community/"+id},
 evseg:id=>{EVSEG=id;route()},ev:id=>evSheet(id),evreg:(id,b)=>evRegister(id,b),
 dmore:()=>discLoad(false),
 dclear:()=>{Object.assign(DISC,{q:"",cat:"",skill:"",region:"",goal:""});route()},
 pub:async()=>{const r=await sb.from("cn_profiles").update({is_public:true}).eq("user_id",U.id);if(r.error){toast(r.error.message,true);return}CP.is_public=true;toast("Profilingiz ochildi ✓");route()},
 avpick:()=>$("#fav").click(),cropok:()=>cropDone(),
 tiadd:(id,b)=>tiAdd(b.dataset.k,id),
 tidel:(id,b)=>{TI[b.dataset.k].splice(parseInt(id),1);tiRender(b.dataset.k)},
 tipick:(id,b)=>{const a=TI.goals,i=a.indexOf(id);if(i>=0)a.splice(i,1);else if(a.length<6)a.push(id);tiRender("goals")},
 save:()=>saveProfile(),
 ach:id=>achSheet(id),achpick:()=>$("#fach").click(),achsave:id=>achSave(id),achdel:id=>achDelete(id)
};
document.addEventListener("click",e=>{
 if(e.target===$("#mod")){closeSheet();return}
 const b=e.target.closest("[data-act]");if(!b)return;
 const a=b.dataset.act;if(!ACT[a])return;
 if(b.tagName!=="A")e.preventDefault&&e.preventDefault();
 Promise.resolve(ACT[a](b.dataset.id,b,e)).catch(er=>{console.error(er);toast((er&&er.message)||"Xatolik",true)});
});
document.addEventListener("input",e=>{
 const t=e.target;
 if(t.dataset&&t.dataset.f)discField(t);
 else if(t.dataset&&t.dataset.ti)tiSug(t.dataset.ti);
 else if(t.dataset&&t.dataset.un)unCheck(t);
 else if(t.id==="e-ab"){$("#e-cnt").textContent=t.value.length+"/300"}
 else if(t.id==="cz"&&AVST){AVST.zoom=parseFloat(t.value)||1;cropDraw()}
});
document.addEventListener("keydown",e=>{
 const t=e.target;
 if(t.dataset&&t.dataset.ti&&e.key==="Enter"){e.preventDefault();tiAdd(t.dataset.ti,t.value)}
 else if(t.dataset&&t.dataset.ti&&e.key==="Backspace"&&!t.value){const k=t.dataset.ti;TI[k].pop();tiRender(k)}
});
$("#fav").addEventListener("change",e=>{const f=e.target.files[0];e.target.value="";if(f)openCrop(f)});
$("#fach").addEventListener("change",e=>{const f=e.target.files[0];e.target.value="";if(!f)return;
 if(!/^image\/(jpeg|png|webp)$/.test(f.type)){toast("Faqat JPG, PNG yoki WebP",true);return}
 if(f.size>15*1024*1024){toast("Rasm juda katta (15 MB gacha)",true);return}
 ACHFILE=f;const l=$("#a-fn");if(l)l.textContent=f.name.slice(0,28)});
/* kesish oynasida siljitish */
let drag=null;
document.addEventListener("pointerdown",e=>{if(e.target.id==="cc"&&AVST){drag={x:e.clientX,y:e.clientY};e.target.setPointerCapture&&e.target.setPointerCapture(e.pointerId)}});
document.addEventListener("pointermove",e=>{if(!drag||!AVST)return;const c=$("#cc"),k=AVST.S/(c.getBoundingClientRect().width||AVST.S),s=AVST.S/Math.min(AVST.iw,AVST.ih)*AVST.zoom;
 AVST.cx-=(e.clientX-drag.x)*k/s;AVST.cy-=(e.clientY-drag.y)*k/s;drag={x:e.clientX,y:e.clientY};cropDraw()});
document.addEventListener("pointerup",()=>{drag=null});
addEventListener("hashchange",()=>{if(U)route()});

/* ---------- ishga tushirish ---------- */
async function boot(){
 try{document.documentElement.dataset.theme=localStorage.getItem("mtheme")||"light"}catch(e){}
 const {data}=await sb.auth.getSession();
 if(!data||!data.session){location.replace("/?login=1");return}
 U=data.session.user;
 await Promise.all([loadMine(),loadAux()]);
 buildNav();paintTop();
 $("#boot").hidden=true;$("#app").hidden=false;
 route();
}
boot().catch(e=>{console.error(e);$("#boot").textContent="Yuklab bo‘lmadi. Sahifani yangilang."});
</script>
