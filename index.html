<html lang="uz">
<head>

<style>
:root{--navy:#0F0E26;--deep:#0D0C1D;--lime:#6366F1;--bg:#F5F7FA;--mut:#687386;--line:#E3E8EF;--ink:#0B1B2B}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit}
:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}.pad{padding:48px 20px}.muted{color:var(--mut)}
h1,h2,h3{line-height:1.15;letter-spacing:-.02em}
h2{font-size:clamp(1.6rem,4vw,2.4rem);font-weight:800}
/* nav */
nav{position:sticky;top:0;z-index:30;background:var(--navy);color:#fff;border-bottom:1px solid rgba(255,255,255,.08)}
nav .wrap{display:flex;align-items:center;gap:22px;height:64px}
.logo{font-weight:800;font-size:1.25rem;letter-spacing:.02em}.logo i{color:var(--lime);font-style:normal}
.links{display:flex;gap:20px;font-size:.88rem;font-weight:500;flex:1}
.links a{color:#C9D3DF;padding:6px 0;border-bottom:2px solid transparent}
.links a:hover,.links a.on{color:#fff;border-color:var(--lime)}
.navr{display:flex;gap:12px;align-items:center}
.burger{display:none;background:none;border:0;color:#fff;font-size:1.6rem;cursor:pointer;margin-left:auto}
.avatar{width:38px;height:38px;border-radius:50%;background:#16293c;display:grid;place-items:center;border:1px solid rgba(255,255,255,.2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;font-weight:700;border-radius:99px;padding:12px 22px;background:var(--navy);color:#fff;font-size:.95rem;transition:.2s}
.btn:hover{filter:brightness(1.12);transform:translateY(-1px)}
.btn.lime{background:var(--lime);color:#ffffff}.btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff}
.btn.sm{padding:8px 16px;font-size:.85rem}.btn.out{background:#fff;color:var(--ink);border:1px solid var(--line)}
@media(max-width:960px){.burger{display:block}.links,.navr{display:none}
 nav.open .wrap{flex-wrap:wrap;height:auto;padding-top:14px;padding-bottom:16px}
 nav.open .links,nav.open .navr{display:flex;flex-direction:column;align-items:stretch;width:100%;gap:12px}}
/* hero */
.hero{background:var(--deep);color:#fff;position:relative;overflow:hidden}
.hero svg{position:absolute;inset:0;width:100%;height:100%}
.hero .in{position:relative;padding:90px 20px 150px}
.lab{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--lime);font-weight:700}
.hero h1{font-size:clamp(3.4rem,12vw,7.5rem);font-weight:800;margin:14px 0 6px}
.hero h2.s{font-size:clamp(1.6rem,4.5vw,2.8rem);font-weight:700;margin-bottom:18px}
.hero p{max-width:520px;color:#C9D3DF}.hero .cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.sum{position:relative;margin:-70px auto 0;max-width:1000px;background:#fff;border-radius:22px;box-shadow:0 20px 50px rgba(7,21,34,.18);padding:22px 28px;display:grid;grid-template-columns:repeat(4,1fr);gap:20px;z-index:2}
.sum small{display:block;color:var(--mut);font-size:.78rem}.sum b{font-size:.98rem}
.sum.one{display:block;text-align:center;color:var(--mut)}
@media(max-width:760px){.sum{grid-template-columns:1fr 1fr;margin:-50px 16px 0}}
/* sections & cards */
section.s{padding:64px 0}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.
  card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 4px 18px rgba(7,21,34,.05);overflow:hidden;display:flex;flex-direction:column;transition:.2s}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(7,21,34,.1)}
.cov{aspect-ratio:16/9;background:linear-gradient(135deg,#0c2338,#14405a);position:relative;background-size:cover;background-position:center}
.dt{position:absolute;left:12px;top:12px;background:#fff;border-radius:10px;padding:4px 10px;text-align:center;font-size:.72rem;font-weight:700;line-height:1.2}
.cb{padding:18px;display:flex;flex-direction:column;gap:8px;flex:1}.cb h3{font-size:1.1rem}.cb p{color:var(--mut);font-size:.9rem}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--mut);font-size:.82rem}
.cb .btn{margin-top:auto;width:100%}
.ico{width:52px;height:52px;border-radius:50%;background:#EEF2FF;display:grid;place-items:center;font-size:1.5rem}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}.tabs button{padding:9px 18px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:600;font-size:.88rem}
.tabs button.on{background:var(--navy);color:#fff}
.bar{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:18px}
input,select,textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff}
textarea{min-height:110px;resize:vertical}label{display:block;font-weight:600;font-size:.88rem;margin-bottom:14px}label>*{margin-top:6px;font-weight:400}
label.chk{display:flex;gap:8px;align-items:center}label.chk input{width:auto;margin:0}
.empty{background:#fff;border:1px dashed #C7D0DB;border-radius:16px;padding:32px;text-align:center;color:var(--mut)}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.76rem;font-weight:700;background:#EEF1F5}
.pending{background:#FFF1D6;color:#9A6200}.approved{background:#EEF2FF;color:#3D3BF3}.rejected{background:#FDE0E0;color:#B42318}.waitlist{background:#E0ECFF;color:#1D4ED8}
.cta{background:var(--navy);color:#fff;border-radius:26px;padding:44px 28px;text-align:center}
.cta p{color:#C9D3DF;margin:10px auto 22px;max-width:520px}
.form{max-width:560px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:22px;padding:30px;box-shadow:0 10px 30px rgba(7,21,34,.07)}
.err{color:#B42318;font-size:.8rem;margin-top:4px;min-height:1em}.cnt{text-align:right;font-size:.8rem;color:var(--mut)}
.det{max-width:820px;margin:0 auto}.det .cov{border-radius:20px;margin-bottom:22px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:20px 0}.kv div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}.kv small{color:var(--mut);display:block;font-size:.76rem}
.pre{white-space:pre-line}
footer{background:var(--navy);color:#C9D3DF;padding:34px 0;margin-top:30px}footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
/* admin */
.adm{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 64px)}
.side{background:var(--navy);padding:18px 12px;display:flex;flex-direction:column;gap:4px}
.side a{color:#C9D3DF;padding:11px 14px;border-radius:10px;font-size:.9rem;font-weight:500}.side a.on{background:#123149;color:var(--lime)}
.main{padding:26px;min-width:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:24px}
.stats div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}.stats b{font-size:2rem;display:block}.stats small{color:var(--mut)}
.tbl{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:.88rem}th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mut);font-size:.76rem;text-transform:uppercase}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin-bottom:14px}
.pg{display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-top:14px}
.modal{position:fixed;inset:0;background:rgba(6,16,28,.6);z-index:50;display:grid;place-items:center;padding:16px}
.mb{background:#fff;border-radius:20px;padding:26px;max-width:560px;width:100%;max-height:90vh;overflow:auto}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:12px;z-index:99}.toast.bad{background:#B42318}
@media(max-width:860px){.adm{grid-template-columns:1fr}.side{flex-direction:row;overflow-x:auto}.side a{white-space:nowrap}.filters{grid-template-columns:1fr}.main{padding:16px}}
</style>
</head>

<script>
/* ====== SOZLAMA: Supabase ma'lumotlarini kiriting ====== */
const CFG={URL:"zrebikqvjbvuwbzcunkw.supabase.co",KEY:"sb_publishable_DszdaPjNPM3i0UbGX3lLjQ_DTjdfLcW",TG:"https://t.me/Mindova_uz"};
const OK=!CFG.URL.startsWith("YOUR-");
const sb=OK?supabase.createClient("https://"+CFG.URL.replace(/^https?:\/\//,""),CFG.KEY):null;

const $=(q,e=document)=>e.querySelector(q);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ML=["yanvar","fevral","mart","aprel","may","iyun","iyul","avgust","sentabr","oktabr","noyabr","dekabr"];
const p2=n=>String(n).padStart(2,"0");
const fd=d=>{if(!d)return"";const x=new Date(d);return `${x.getDate()}-${ML[x.getMonth()]} ${x.getFullYear()}`};
const ftm=d=>{const x=new Date(d);return `${p2(x.getHours())}:${p2(x.getMinutes())}`};
const ST={pending:"Kutilmoqda",approved:"Tasdiqlandi",rejected:"Rad etildi",waitlist:"Kutish ro‘yxati"};
const PS={draft:"Qoralama",published:"E’lon qilingan",archived:"Arxiv"};

const S={user:null,admin:false,set:{}};
const pill=s=>`<span class="pill ${s}">${ST[s]||PS[s]||s}</span>`;
const q=async p=>{const{data,error}=await p;if(error)throw error;return data};
const need=()=>{if(!OK)throw new Error("Ma’lumotlar bazasi ulanmagan. index.html ichidagi CFG ni to‘ldiring.")};
function toast(m,bad){const t=document.createElement("div");t.className="toast"+(bad?" bad":"");t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}
function modal(html){closeM();const m=document.createElement("div");m.className="modal";m.id="modal";m.innerHTML=`<div class="mb">${html}</div>`;m.onclick=e=>{if(e.target===m)closeM()};document.body.appendChild(m)}
function closeM(){$("#modal")?.remove()}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeM()});
const tg=()=>S.set.tg_url||CFG.TG;

/* ====== NAV ====== */
const NAV=[["","Bosh sahifa"],["tadbirlar","Tadbirlar"],["rivojlanish","Rivojlanish"],["imkoniyatlar","Imkoniyatlar"],["biz-haqimizda","Biz haqimizda"]];
function drawNav(p){
  $("#links").innerHTML=NAV.map(([h,t])=>`<a href="#/${h}" class="${p===h?"on":""}">${t}</a>`).join("")+`<a href="${esc(tg())}" target="_blank" rel="noopener">Telegram kanalimiz</a>`;
  $("#navr").innerHTML=`<a class="btn lime sm" href="#/royxat">Ro‘yxatdan o‘tish</a>`+(S.admin?`<a class="btn ghost sm" href="#/admin">Admin panel</a>`:"")+
   `<a class="avatar" href="#/${S.user?"kabinet":"login"}" title="Mening kabinetim" aria-label="Mening kabinetim">👤</a>`;
  $("#ftg").href=tg();$("#nav").classList.remove("open");
}

/* ====== ROUTER ====== */
const V={},H={};
async function route(){
  const[p="",a]=location.hash.replace(/^#\/?/,"").split("/");
  drawNav(p);const k=p||"home";
  $("#app").innerHTML='<div class="wrap pad muted">Yuklanmoqda…</div>';
  try{
    if(!V[k]){$("#app").innerHTML='<div class="wrap pad"><div class="empty">Sahifa topilmadi. <a href="#/" style="text-decoration:underline">Bosh sahifaga qaytish</a></div></div>'}
    else{$("#app").innerHTML=await V[k](a);H[k]?.(a)}
  }catch(e){$("#app").innerHTML=`<div class="wrap pad"><div class="empty">Xatolik: ${esc(e.message)}</div></div>`}
  scrollTo(0,0);
}

/* ====== KOMPONENTLAR ====== */
const evCard=e=>{const d=e.starts_at?new Date(e.starts_at):null;
 return--ink);line-height:1.55;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button,input,select,textare""}">${d?`<div class="dt">${d.getDate()}<br>${ML[d.getMonth()].slice(0,3)}</div>`:""}</div>
 <div class="cb"><h3>${esc(e.title)}</h3><p>${esc((e.description||"").slice(0,110))}</p>
 <div class="meta">${e.location?`<span>📍 ${esc(e.location)}</span>`:""}${e.format?`<span>🏷 ${esc(e.format)}</span>`:""}${d?`<span>🗓 ${fd(e.starts_at)}</span>`:""}</div>
 <a class="btn lime" href="#/tadbirlar/${esc(e.slug)}">Batafsil →</a></div></article>`};
const opCard=o=>`<article class="card"><div class="cb"><span class="pill">${esc(o.category)}</span><h3>${esc(o.title)}</h3><p>${esc(o.description)}</p>
 ${o.eligibility?`<p><b>Talablar:</b> ${esc(o.eligibility)}</p>`:""}${o.deadline?`<p><b>Muddat:</b> ${fd(o.deadline)}</p>`:""}
 ${o.source_url?`<p class="muted">Rasmiy manba: <a style="text-decoration:underline" href="${esc(o.source_url)}" target="_blank" rel="noopener">${esc(new URL(o.source_url).hostname)}</a></p><a class="btn lime" href="${esc(o.source_url)}" target="_blank" rel="noopener">Ko‘rish ↗</a>`:""}</div></article>`;
const rsCard=r=>`<article class="card"><div class="cb"><div class="ico">${esc(r.icon||"📘")}</div><h3>${esc(r.title)}</h3><p>${esc(r.description)}</p><a class="btn" href="#/rivojlanish/${esc(r.slug)}">Ko‘rish</a></div></article>`;
const emptyMsg=t=>`<div class="empty">${t}</div>`;

/* ====== 1. BOSH SAHIFA ====== */
V.home=async()=>{need();const s=S.set;
 const evs=await q(sb.from("events").select("*").eq("status","published").gte("starts_at",new Date().toISOString()).order("starts_at").limit(3));
 const ops=await q(sb.from("opportunities").select("*").eq("status","published").order("created_at",{ascending:false}).limit(3));
 const rs=await q(sb.from("resources").select("*").eq("status","published").limit(6));
 const has=s.ev_date||s.ev_place||s.ev_format||s.ev_for;
 return `<header class="hero"><svg viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0F0E26"/><stop offset="1" stop-color="#0D0C1D"/></linearGradient></defs><rect width="1200" height="600" fill="url(#g)"/><path d="M380 600 L620 250 L720 380 L860 180 L1200 520 L1200 600Z" fill="#13122B"/><path d="M500 600 L760 300 L900 420 L1200 330 L1200 600Z" fill="#181735"/><path d="M560 600 C700 470 760 420 860 300 S1050 150 1200 90" stroke="#6366F1" stroke-width="26" fill="none" stroke-linecap="round" opacity=".9"/></svg>
 <div class="wrap in"><div class="lab">${esc(s.hero_label||"Yoshlar uchun platforma")}</div><h1>MINDOVA</h1><h2 class="s">Fikrla. Muloqot qil. Yarat.</h2>
 <p>${esc(s.hero_text||"MINDOVA — fikr almashish, yangi insonlar bilan tanishish, foydali ko‘nikmalarni rivojlantirish va yangi imkoniyatlarni kashf etish maydoni.")}</p>
 <div class="cta"><a class="btn lime" href="#/royxat">Ro‘yxatdan o‘tish</a><a class="btn ghost" href="#/biz-haqimizda">Biz haqimizda</a></div></div></header>
 <div class="wrap">${has?`<div class="sum"><div><small>Sana</small><b>${esc(s.ev_date||"—")}</b></div><div><small>Manzil</small><b>${esc(s.ev_place\vert{}\vert{}"—")}</b></div><div><small>Format</small><b>${esc(s.ev_format||"—")}</b></div><div><small>Ishtirokchilar uchun</small><b>${esc(s.ev_for||"—")}</b></div></div>`:`<div class="sum one">Yaqinlashayotgan tadbir haqida ma’lumot tez orada e’lon qilinadi.</div>`}</div>
 <section class="s"><div class="wrap"><h2>MINDOVA haqida</h2><p class="muted pre" style="max-width:760px;margin-top:12px">${esc(s.
                                                                                                                                about_what||"MINDOVA — yoshlar uchun fikr almashish, rivojlanish va kelajak sari birgalikda harakat qilish maydoni.")}</p></div></section>
 <section class="s" style="padding-top:0"><div class="wrap"><div class="head"><h2>Yaqinlashayotgan tadbirlar</h2><a class="btn out sm" href="#/tadbirlar">Barchasi</a></div>
 ${evs.length?`<div class="grid">${evs.map(evCard).join("")}</div>`:emptyMsg("Hozircha kelgusi tadbirlar yo‘q.")}</div></section>
 <section class="s" style="padding-top:0"><div class="wrap"><div class="head"><h2>Rivojlanish imkoniyatlari</h2><a class="btn out sm" href="#/rivojlanish">Barchasi</a></div>
 ${rs.length?`<div class="grid">${rs.map(rsCard).join("")}</div>`:emptyMsg("Rivojlanish materiallari tez orada qo‘shiladi.")}</div></section>
 <section class="s" style="padding-top:0"><div class="wrap"><div class="head"><h2>Dolzarb imkoniyatlar</h2><a class="btn out sm" href="#/imkoniyatlar">Barchasi</a></div>
 ${ops.length?`<div class="grid">${ops.map(opCard).join("")}</div>`:emptyMsg("Hozircha e’lon qilingan imkoniyatlar yo‘q.")}</div></section>
 <section class="s" style="padding-top:0"><div class="wrap"><div class="cta"><h2>MINDOVA’ga qo‘shiling</h2><p>Fikrlaydigan, harakat qiladigan yoshlar hamjamiyatining bir qismi bo‘ling.</p><a class="btn lime" href="#/royxat">Ro‘yxatdan o‘tish</a> <a class="btn ghost" href="${esc(tg())}" target="_blank" rel="noopener">Telegram kanalimiz</a></div></div></section>`};

/* ====== 2. TADBIRLAR ====== */
V.tadbirlar=async slug=>{need();
 if(slug){const e=await q(sb.from("events").select("*").eq("slug",slug).maybeSingle());
  if(!e)return emptyMsg("Tadbir topilmadi.").replace('class="empty"','class="empty wrap" style="margin:40px auto"');
  const past=e.starts_at&&new Date(e.starts_at)<new Date();
  const dl=e.registration_deadline&&new Date(e.registration_deadline)<new Date();
  const open=e.registration_open&&!dl&&!past&&e.status==="published";
  const stat=e.status==="archived"?"Arxivlangan":past?"Yakunlangan":open?"Ro‘yxat ochiq":"Ro‘yxat yopiq";
  return `<div class="wrap pad"><div class="det"><a class="muted" href="#/tadbirlar">← Barcha tadbirlar</a><div style="height:14px"></div>
  <div class="cov" style="${e.cover_url?`background-image:url('${esc(e.cover_url)}')`:""}"></div><h2>${esc(e.title)}</h2>
  <div class="kv"><div><small>Sana va vaqt</small><b>${e.starts_at?fd(e.starts_at)+", "+ftm(e.starts_at):"Belgilanmagan"}</b></div><div><small>Manzil</small><b>${esc(e.location||"Belgilanmagan")}</b></div><div><small>Format</small><b>${esc(e.format||"—")}</b></div><div><small>Holati</small><b>${stat}</b></div>${e.registration_deadline?`<div><small>Ro‘yxat muddati</small><b>${fd(e.registration_deadline)}</b></div>`:""}</div>
  <h3>Tavsif</h3><p class="pre muted">${esc(e.description||"Tavsif qo‘shilmagan.")}</p>
  ${e.requirements?`<h3 style="margin-top:20px">Ishtirok talablari</h3><p class="pre muted">${esc(e.requirements)}</p>`:""}
  <div style="margin-top:26px">${open?`<a class="btn lime" href="#/royxat/${e.id}">Ro‘yxatdan o‘tish</a>`:`<span class="pill">${stat}</span>`}</div></div></div>`}

 return `<label>${l}<input type="${t}" name="${k}" value="${esc(val)}"></label>`};
window.adForm=(ent,i)=>{const r=i===undefined?null:window["R_"+ent][i];modal(`<h3 style="font-size:1.3rem;margin-bottom:16px">${FLD[ent].t}: ${r?"tahrirlash":"yangi"}</h3><form id="fm">${FLD[ent].f.map(f=>inp(f,r)).join("")}<div style="display:flex;gap:10px"><button class="btn lime">Saqlash</button><button type="button" class="btn out" onclick="closeM()">Bekor qilish</button></div></form>`);
 $("#fm").onsubmit=async e=>{e.preventDefault();const fm=e.target,o={};
  for(const[k,,t]of FLD[ent].f){const el=fm.elements[k];
   if(t==="bool")o[k]=el.checked;
   else if(t==="file"){if(el.files[0]){const fl=el.files[0],path=`${Date.now()}-${fl.name.replace(/[^\w.]/g,"_")}`;const{error}=await sb.storage.from("covers").upload(path,fl);if(error)return toast(error.message,1);o[k]=sb.
                                                                                  storage.from("covers").getPublicUrl(path).data.publicUrl}}
   else if(t==="datetime-local")o[k]=el.value?new Date(el.value).toISOString():null;
   else o[k]=el.value||null}
  if(!o.title)return toast("Nomini kiriting.",1);
  if(!r&&ent!=="opportunities")o.slug=o.title.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")+"-"+Date.now().toString(36);
  const res=r?await sb.from(ent).update(o).eq("id",r.id):await sb.from(ent).insert(o);
  if(res.error)return toast(res.error.message,1);toast("Saqlandi");closeM();route()}};

async function adRep(c){const[evs,regs]=await Promise.all([q(sb.from("events").select("id,title")),q(sb.from("registrations").select("event_id,status").limit(10000))]);
 const rows=[...evs.map(e=>[e.id,e.title]),[null,"Umumiy arizalar"]].map(([id,t])=>{const r=regs.filter(x=>x.event_id===id);const n=s=>r.filter(x=>x.status===s).length;return `<tr><td>${esc(t)}</td><td>${r.length}</td><td>${n("approved")}</td><td>${n("pending")}</td><td>${n("waitlist")}</td><td>${n("rejected")}</td></tr>`}).join("");
 c.innerHTML=`<h2 style="margin-bottom:18px">Hisobotlar</h2><div class="tbl"><table><thead><tr><th>Tadbir</th><th>Jami</th><th>Tasdiqlandi</th><th>Kutilmoqda</th><th>Kutish ro‘yxati</th><th>Rad etildi</th></tr></thead><tbody>${rows}</tbody></table></div>`}
function adSet(c){c.innerHTML=`<h2 style="margin-bottom:18px">Sozlamalar</h2><form id="sf" style="max-width:640px">${SETK.map(([k,l,t])=>`<label>${l}${t?`<textarea name="${k}">${esc(S.set[k]||"")}</textarea>`:`<input name="${k}" value="${esc(S.set[k]||"")}">`}</label>`).join("")}<button class="btn lime">Saqlash</button></form>`;
 $("#sf").onsubmit=async e=>{e.preventDefault();const rows=SETK.map(([k])=>({key:k,value:e.target.elements[k].value,updated_at:new Date().toISOString()}));
  const{error}=await sb.from("site_settings").upsert(rows);if(error)return toast(error.message,1);rows.forEach(r=>S.set[r.key]=r.value);toast("Saqlandi")}}

async function whoami(u){S.user=u;S.admin=false;
 if(u){const{data}=await sb.from("admins").select("id").eq("user_id",u.id).eq("is_active",true).maybeSingle();S.admin=!!data}}
(async()=>{$("#yr").textContent=new Date().getFullYear();
 if(OK){try{const rows=await q(sb.from("site_settings").select("*"));rows.forEach(r=>S.set[r.key]=r.value)}catch{}
  const{data:{session}}=await sb.auth.getSession();await whoami(session?.user??null);
  sb.auth.onAuthStateChange(async(_e,s)=>{const was=S.user?.id;await whoami(s?.user??null);if(was!==s?.user?.id)route()})}
 addEventListener("hashchange",route);route()})();
