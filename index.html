<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MINDOVA – Events & Team</title>
<meta name="description" content="MINDOVA: announcements for our upcoming events, and the team behind them.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F0FA; --card:#FFFFFF; --ink:#1B1A3A; --muted:#5E5C80;
  --brand:#3D3BF3; --sun:#FFB84D; --line:#D9D7F0;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#14132B;--card:#1F1E3F;--ink:#F1F0FA;--muted:#A9A7CF;--brand:#8C8BFF;--sun:#FFB84D;--line:#34325F}
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;line-height:1.6}
h1,h2,h3{font-family:"Bricolage Grotesque","DM Sans",sans-serif;line-height:1.05}
a{color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.wrap{max-width:1100px;margin:0 auto;padding:0 24px}

/* nav */
nav{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;justify-content:space-between;align-items:center;height:60px}
.logo{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.25rem;text-decoration:none;letter-spacing:.02em}
nav ul{display:flex;gap:24px;list-style:none;padding:0}
nav ul a{text-decoration:none;font-weight:500;color:var(--muted)}
nav ul a:hover{color:var(--brand)}

/* hero */
.hero{padding:72px 0 56px}
.hero h1{font-weight:800;font-size:clamp(3.2rem,13vw,9rem);letter-spacing:-.03em;color:var(--brand)}
.hero p.lead{max-width:34ch;font-size:1.25rem;color:var(--muted);margin-top:20px}
.next{margin-top:40px;display:flex;gap:20px;align-items:center;flex-wrap:wrap;background:var(--ink);color:var(--bg);border-radius:20px;padding:20px 24px;max-width:640px}
.next .tag{background:var(--sun);color:#1B1A3A;font-weight:700;padding:4px 12px;border-radius:99px;font-size:.9rem}
.next strong{font-family:"Bricolage Grotesque",sans-serif;font-size:1.4rem;display:block}
.next span.meta{opacity:.8;font-size:.95rem}

section{padding:56px 0}
section h2{font-size:clamp(2rem,5vw,3rem);font-weight:800;margin-bottom:8px}
section .sub{color:var(--muted);margin-bottom:32px}

/* events */
.events{display:grid;gap:16px}
.event{display:grid;grid-template-columns:84px 1fr auto;gap:20px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 22px}
.date{text-align:center;background:var(--brand);color:#fff;border-radius:12px;padding:10px 0}
.date b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:1.9rem;line-height:1}
.date small{font-size:.85rem}
.event h3{font-size:1.35rem;margin-bottom:4px}
.event p{color:var(--muted);font-size:.95rem}
.btn{display:inline-block;text-decoration:none;font-weight:700;background:var(--sun);color:#1B1A3A;padding:10px 20px;border-radius:99px;white-space:nowrap}
.btn:hover{filter:brightness(1.06)}
.past{opacity:.6}
.past .date{background:var(--muted)}
@media(max-width:640px){.event{grid-template-columns:72px 1fr}.event .btn{grid-column:1/-1;text-align:center}}

/* team scroller */
.team-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap}
.arrows button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:1.2rem;cursor:pointer}
.arrows button:hover{border-color:var(--brand);color:var(--brand)}
.scroller{display:flex;gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;padding:8px 24px 24px;scrollbar-width:thin}
.member{flex:0 0 260px;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.photo{aspect-ratio:1/1;display:grid;place-items:center;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:4rem;color:#fff}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.member .info{padding:16px 18px 20px}
.member h3{font-size:1.2rem}
.member .role{color:var(--brand);font-weight:700;font-size:.95rem;margin-bottom:6px}
.member p{color:var(--muted);font-size:.92rem}

footer{border-top:1px solid var(--line);padding:32px 0;color:var(--muted)}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
</style>
</head>
<body>

<nav>
  <div class="wrap">
    <a class="logo" href="#top">MINDOVA</a>
    <ul>
      <li><a href="#events">Events</a></li>
      <li><a href="#team">Team</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </div>
</nav>

<header class="hero" id="top">
  <div class="wrap">
    <h1>MINDOVA</h1>
    <p class="lead">Where we announce our events and introduce the people who run them.</p>
    <div class="next" id="next"></div>
  </div>
</header>

<main>
  <section id="events">
    <div class="wrap">
      <h2>Events</h2>
      <p class="sub">Upcoming events first. Register early, places are limited.</p>
      <div class="events" id="eventList"></div>
    </div>
  </section>

  <section id="team">
    <div class="wrap team-head">
      <div>
        <h2>The team</h2>
        <p class="sub" style="margin-bottom:0">Scroll sideways to meet everyone.</p>
      </div>
      <div class="arrows">
        <button id="prev" aria-label="Previous members">←</button>
        <button id="nextBtn" aria-label="Next members">→</button>
      </div>
    </div>
    <div class="scroller" id="scroller" tabindex="0" aria-label="Team members"></div>
  </section>
</main>

<footer id="contact">
  <div class="wrap">
    <span>© <span id="yr"></span> MINDOVA</span>
    <a href="mailto:hello@example.com">hello@example.com</a>
    <a href="https://t.me/your_channel">Telegram</a>
  </div>
</footer>

<script>
async function main(){
let EVENTS=[],TEAM=[];
try{
  const r=await fetch("/api/data",{cache:"no-store"});
  ({events:EVENTS,team:TEAM}=await r.json());
}catch(e){ console.error("Could not load data",e); }


const today = new Date(); today.setHours(0,0,0,0);
const fmt = (d,o)=>new Date(d+"T00:00:00").toLocaleDateString("en-GB",o);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const sorted = [...EVENTS].sort((a,b)=>a.date.localeCompare(b.date));
const upcoming = sorted.filter(e=>new Date(e.date+"T00:00:00")>=today);
const past = sorted.filter(e=>new Date(e.date+"T00:00:00")<today).reverse();

// next event banner
const nx = upcoming[0];
document.getElementById("next").innerHTML = nx
  ? `<span class="tag">Next event</span><div><strong>${esc(nx.title)}</strong><span class="meta">${fmt(nx.date,{day:"numeric",month:"long"})} · ${esc(nx.time)} · ${esc(nx.place)}</span></div>`
  : `<span class="tag">Stay tuned</span><div><strong>New events coming soon</strong></div>`;

// event list
const card = (e,isPast)=>`
  <article class="event ${isPast?"past":""}">
    <div class="date"><b>${fmt(e.date,{day:"numeric"})}</b><small>${fmt(e.date,{month:"short"})}</small></div>
    <div><h3>${esc(e.title)}</h3><p>${esc(e.time)} · ${esc(e.place)}</p><p>${esc(e.desc)}</p></div>
    ${!isPast && e.link ? `<a class="btn" href="${esc(e.link)}" target="_blank" rel="noopener">Register</a>` : ""}
  </article>`;
document.getElementById("eventList").innerHTML =
  upcoming.map(e=>card(e,false)).join("") + past.map(e=>card(e,true)).join("");

// team
const colors = ["#3D3BF3","#E4572E","#17A398","#7B4BDB","#D4376B","#2F7DE1"];
document.getElementById("scroller").innerHTML = TEAM.map((m,i)=>{
  const initials = m.name.split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase();
  const pic = m.photo
    ? `<div class="photo"><img src="${esc(m.photo)}" alt="${esc(m.name)}" loading="lazy"></div>`
    : `<div class="photo" style="background:${colors[i%colors.length]}" aria-hidden="true">${initials}</div>`;
  return `<article class="member">${pic}<div class="info"><h3>${esc(m.name)}</h3><div class="role">${esc(m.role)}</div><p>${esc(m.bio)}</p></div></article>`;
}).join("");

const sc = document.getElementById("scroller");
document.getElementById("prev").onclick = ()=>sc.scrollBy({left:-280,behavior:"smooth"});
document.getElementById("nextBtn").onclick = ()=>sc.scrollBy({left:280,behavior:"smooth"});
document.getElementById("yr").textContent = new Date().getFullYear();
}
main();
</script>
</body>
</html>
