<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MINDOVA — Admin Panel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
body{font-family:system-ui,sans-serif;background:#0F0E26;color:#fff;margin:0;padding:20px}
h1,h2{color:#6366F1}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tabs{display:flex;gap:10px;margin:16px 0;flex-wrap:wrap}
.tab-btn{background:#1B1A3A;color:#fff;border:1px solid #333;padding:10px 20px;border-radius:8px;cursor:pointer;width:auto}
.tab-btn.active{background:#6366F1}
.section{display:none;background:#181735;padding:20px;border-radius:12px}
.section.active{display:block}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;margin-top:15px;min-width:560px}
th,td{border:1px solid rgba(255,255,255,.1);padding:10px;text-align:left;font-size:.9rem}
th{background:#25234A}
input,textarea,button,select{width:100%;padding:10px;margin:8px 0;border-radius:6px;border:1px solid #444;background:#0F0E26;color:#fff;box-sizing:border-box;font:inherit}
button.submit-btn{background:#6366F1;cursor:pointer;font-weight:bold}
#out{width:auto;margin:0;cursor:pointer}
label{display:block;font-size:.85rem;color:#9FB0FF;margin-top:8px}
.msg{min-height:1.2em;font-size:.9rem;color:#9FB0FF}
</style>
</head>
<body>
<div class="top"><h1>MINDOVA Admin Panel</h1><button id="out" class="tab-btn" type="button">Chiqish</button></div>
<div class="tabs">
 <button class="tab-btn active" data-tab="users">Ro'yxatdan o'tganlar</button>
 <button class="tab-btn" data-tab="events">Tadbirlar</button>
 <button class="tab-btn" data-tab="team">Jamoa</button>
 <button class="tab-btn" data-tab="opps">Imkoniyatlar</button>
</div>

<div id="users" class="section active">
 <h2>Ro'yxatdan o'tgan foydalanuvchilar</h2>
 <div class="scroll"><table>
  <thead><tr><th>Ism Familiya</th><th>Yosh</th><th>Telegram</th><th>Izoh</th><th>Sana</th></tr></thead>
  <tbody id="userList"></tbody>
 </table></div>
 <div class="msg" id="uMsg"></div>
</div>

<div id="events" class="section">
 <h2>Yangi tadbir qo'shish</h2>
 <form id="addEventForm">
  <input type="text" id="evTitle" placeholder="Tadbir nomi" required>
  <input type="date" id="evDate" required>
  <input type="time" id="evTime" required>
  <input type="text" id="evPlace" placeholder="O'tkazilish joyi" required>
  <textarea id="evDesc" placeholder="Tadbir haqida batafsil" rows="3"></textarea>
  <label>Tadbir rasmi<input type="file" id="evImg" accept="image/*"></label>
  <button type="submit" class="submit-btn">Tadbirni saqlash</button>
  <div class="msg" id="eMsg"></div>
 </form>
</div>

<div id="opps" class="section">
 <h2>Yangi imkoniyat / ish e'loni</h2>
 <form id="addOppForm">
  <input type="text" id="opTitle" placeholder="Sarlavha (masalan: SMM mutaxassisi)" required>
  <select id="opCat"><option>Ish</option><option>Stajirovka</option><option>Grant</option><option>Stipendiya</option><option>Kurs</option><option>Boshqa</option></select>
  <textarea id="opDesc" placeholder="Batafsil ma'lumot" rows="3" required></textarea>
  <input type="text" id="opElig" placeholder="Talablar (ixtiyoriy)">
  <label>Muddat (ixtiyoriy)<input type="date" id="opDeadline"></label>
  <input type="text" id="opUrl" placeholder="Havola: https://... (ixtiyoriy)">
  <label>Rasm (ixtiyoriy)<input type="file" id="opImg" accept="image/*"></label>
  <button type="submit" class="submit-btn">E'lonni saqlash</button>
  <div class="msg" id="oMsg"></div>
 </form>
 <h2 style="margin-top:28px">Joylangan e'lonlar</h2>
 <div id="opList"></div>
</div>

<div id="team" class="section">
 <h2>Jamoa a'zosini qo'shish</h2>
 <form id="addTeamForm">
  <input type="text" id="mName" placeholder="Ism Familiya" required>
  <input type="text" id="mRole" placeholder="Lavozimi (masalan: Asoschi)" required>
  <label>Rasm yuklash<input type="file" id="mFile" accept="image/*"></label>
  <input type="text" id="mPhoto" placeholder="yoki rasm havolasi (URL)">
  <textarea id="mBio" placeholder="Qisqacha bio" rows="3"></textarea>
  <button type="submit" class="submit-btn">A'zoni saqlash</button>
  <div class="msg" id="tMsg"></div>
 </form>
</div>

<script>
const sb=supabase.createClient("https://zrebikqvjbvuwbzcunkw.supabase.co","sb_publishable_DszdaPjNPM3i0UbGX3lLjQ_DTjdfLcW");
const $=id=>document.getElementById(id);

document.querySelectorAll(".tab-btn[data-tab]").forEach(b=>b.onclick=()=>{
 document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
 document.querySelectorAll(".tab-btn[data-tab]").forEach(x=>x.classList.remove("active"));
 $(b.dataset.tab).classList.add("active");
 b.classList.add("active");
});

async function prep(file){
 const img=await createImageBitmap(file);
 const s=Math.min(1,1400/Math.max(img.width,img.height));
 const c=document.createElement("canvas");
 c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
 c.getContext("2d").drawImage(img,0,0,c.width,c.height);
 return new Promise(r=>c.toBlob(r,"image/jpeg",.85));
}
async function upImg(file,folder){
 const blob=await prep(file);
 const path=folder+"/"+Date.now()+"-"+Math.random().toString(36).slice(2,8)+".jpg";
 const {error}=await sb.storage.from("images").upload(path,blob,{contentType:"image/jpeg"});
 if(error)throw error;
 return sb.storage.from("images").getPublicUrl(path).data.publicUrl;
}

$("out").onclick=async()=>{await sb.auth.signOut();location.href="/"};

async function loadUsers(){
 const {data,error}=await sb.from("registrations").select("*").order("created_at",{ascending:false});
 const tb=$("userList");
 tb.innerHTML="";
 if(error){$("uMsg").textContent="Yuklab bo'lmadi: "+error.message;return}
 if(!data.length){$("uMsg").textContent="Hozircha arizalar yo'q.";return}
 $("uMsg").textContent="";
 data.forEach(u=>{
  const tr=document.createElement("tr");
  [u.full_name,u.age,u.telegram,u.letter,u.created_at?new Date(u.created_at).toLocaleDateString():""].forEach(v=>{
   const td=document.createElement("td");
   td.textContent=v??"";
   tr.appendChild(td);
  });
  tb.appendChild(tr);
 });
}

$("addEventForm").onsubmit=async e=>{
 e.preventDefault();
 $("eMsg").textContent="Saqlanmoqda…";
 let image_url=null;
 try{const fl=$("evImg").files[0];if(fl)image_url=await upImg(fl,"events")}
 catch(err){$("eMsg").textContent="Rasm yuklanmadi: "+err.message;return}
 const row={
  image_url,
  title:$("evTitle").value.trim(),
  slug:($("evTitle").value.trim().toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"")||"event")+"-"+Date.now().toString(36),
  description:$("evDesc").value.trim(),
  starts_at:new Date($("evDate").value+"T"+$("evTime").value).toISOString(),
  location:$("evPlace").value.trim(),
  status:"published",
  registration_open:true
 };
 const {error}=await sb.from("events").insert([row]);
 $("eMsg").textContent=error?"Xato: "+error.message:"Tadbir saqlandi ✓";
 if(!error)e.target.reset();
};

$("addTeamForm").onsubmit=async e=>{
 e.preventDefault();
 $("tMsg").textContent="Saqlanmoqda…";
 let photo=$("mPhoto").value.trim()||null;
 try{const fl=$("mFile").files[0];if(fl)photo=await upImg(fl,"team")}
 catch(err){$("tMsg").textContent="Rasm yuklanmadi: "+err.message;return}
 const row={name:$("mName").value.trim(),role:$("mRole").value.trim(),photo,bio:$("mBio").value.trim()};
 const {error}=await sb.from("team").insert([row]);
 $("tMsg").textContent=error?"Xato: "+error.message:"A'zo saqlandi ✓";
 if(!error)e.target.reset();
};

async function loadOpps(){
 const {data,error}=await sb.from("opportunities").select("id,title,category").order("created_at",{ascending:false});
 const box=$("opList");
 box.innerHTML="";
 if(error){box.textContent="Yuklab bo'lmadi: "+error.message;return}
 if(!data.length){box.textContent="Hozircha e'lonlar yo'q.";return}
 data.forEach(o=>{
  const row=document.createElement("div");
  row.style.cssText="display:flex;gap:10px;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.1);padding:8px 0";
  const t=document.createElement("span");
  t.textContent=(o.category?o.category+" · ":"")+o.title;
  const d=document.createElement("button");
  d.textContent="O'chirish";d.type="button";d.className="tab-btn";d.style.flex="none";
  d.onclick=async()=>{
   if(!confirm("O'chirilsinmi?"))return;
   const {error}=await sb.from("opportunities").delete().eq("id",o.id);
   if(error){alert("Xato: "+error.message);return}
   loadOpps();
  };
  row.append(t,d);
  box.appendChild(row);
 });
}

$("addOppForm").onsubmit=async e=>{
 e.preventDefault();
 $("oMsg").textContent="Saqlanmoqda…";
 let image_url=null;
 try{const fl=$("opImg").files[0];if(fl)image_url=await upImg(fl,"opps")}
 catch(err){$("oMsg").textContent="Rasm yuklanmadi: "+err.message;return}
 const title=$("opTitle").value.trim();
 const row={title,category:$("opCat").value,description:$("opDesc").value.trim(),eligibility:$("opElig").value.trim()||null,deadline:$("opDeadline").value||null,source_url:$("opUrl").value.trim()||null,image_url,status:"published"};
 let {error}=await sb.from("opportunities").insert([row]);
 if(error&&/slug/i.test(error.message)){
  row.slug=(title.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"")||"opp")+"-"+Date.now().toString(36);
  ({error}=await sb.from("opportunities").insert([row]));
 }
 $("oMsg").textContent=error?"Xato: "+error.message:"E'lon saqlandi ✓";
 if(!error){e.target.reset();loadOpps()}
};

(async()=>{
 const {data}=await sb.auth.getSession();
 if(!data.session){location.href="/";return}
 loadUsers();
 loadOpps();
})();
</script>
</body>
</html>
