<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sertifikatni tekshirish — MINDOVA</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box;margin:0}
body{font-family:Inter,system-ui,sans-serif;background:#0b0b24;color:#e8eaff;min-height:100vh;display:grid;place-items:center;padding:20px;line-height:1.5}
.box{width:100%;max-width:480px;background:linear-gradient(160deg,#16163f,#101033);border:1px solid rgba(255,255,255,.09);border-radius:18px;padding:28px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.logo{font-weight:800;font-size:1.3rem;margin-bottom:6px}.logo i{color:#6366F1;font-style:normal}
h1{font-size:1.4rem;margin-bottom:6px}.m{color:#9aa0d0;font-size:.92rem;margin-bottom:18px}
input{width:100%;padding:13px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:#0b0b24;color:#fff;font:inherit;text-transform:uppercase;margin-bottom:12px}
button{width:100%;border:0;border-radius:99px;padding:13px;background:#6366F1;color:#fff;font:inherit;font-weight:700;cursor:pointer}
button:disabled{opacity:.6}
.r{margin-top:20px;border-radius:14px;padding:18px}
.ok{background:#0f3a2a;border:1px solid #1f7a55}.no{background:#4a1822;border:1px solid #8a2c3d}
.r h2{font-size:1.1rem;margin-bottom:10px}.r p{font-size:.95rem;margin:4px 0}.r span{color:#9aa0d0}
a{color:#a5b4fc;display:block;text-align:center;margin-top:18px;font-size:.9rem;text-decoration:none}
</style></head><body>
<div class="box">
 <div class="logo"><i>M</i> MINDOVA</div>
 <h1>Sertifikatni tekshirish</h1>
 <p class="m">Sertifikatdagi raqamni kiriting (masalan: MND-A1B2C3D4).</p>
 <form id="f"><input id="c" placeholder="MND-XXXXXXXX" maxlength="30" autocomplete="off" required><button id="b">Tekshirish</button></form>
 <div id="out"></div>
 <a href="/">← Saytga qaytish</a>
</div>
<script>
const sb=supabase.createClient("https://zrebikqvjbvuwbzcunkw.supabase.co","sb_publishable_DszdaPjNPM3i0UbGX3lLjQ_DTjdfLcW");
const $=q=>document.querySelector(q);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ML=["yanvar","fevral","mart","aprel","may","iyun","iyul","avgust","sentabr","oktabr","noyabr","dekabr"];
const fd=d=>{const x=new Date(d);return !d||isNaN(x)?"":`${x.getDate()}-${ML[x.getMonth()]} ${x.getFullYear()}`};
async function check(code){
 const b=$("#b"),out=$("#out");
 b.disabled=true;b.textContent="Tekshirilmoqda…";out.innerHTML="";
 const {data,error}=await sb.rpc("verify_certificate",{p_code:code.trim()});
 b.disabled=false;b.textContent="Tekshirish";
 if(error){out.innerHTML=`<div class="r no"><h2>Xatolik yuz berdi</h2><p>Qayta urinib ko‘ring.</p></div>`;return}
 const r=data&&data[0];
 out.innerHTML=r?`<div class="r ok"><h2>✅ Sertifikat haqiqiy</h2><p><span>Egasi:</span> <b>${esc(r.full_name||"—")}</b></p><p><span>Sertifikat:</span> ${esc(r.title)}</p>${r.event_title?`<p><span>Tadbir:</span> ${esc(r.event_title)}</p>`:""}<p><span>Berilgan sana:</span> ${fd(r.issued_at)}</p></div>`
 :`<div class="r no"><h2>❌ Sertifikat topilmadi</h2><p>Raqamni tekshirib, qayta kiriting.</p></div>`;
}
$("#f").onsubmit=e=>{e.preventDefault();check($("#c").value)};
const q=new URLSearchParams(location.search).get("code");
if(q){$("#c").value=q;check(q)}
</script></body></html>
