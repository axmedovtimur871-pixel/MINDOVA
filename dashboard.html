<!DOCTYPE html>

<style>
:root{--l:rgba(255,255,255,.09);--a:#6366F1;--m:#9aa0d0}
*{box-sizing:border-box;margin:0}
body{font-family:Inter,system-ui,sans-serif;background:#0b0b24;color:#e8eaff;line-height:1.5}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}
[hidden]{display:none!important}
.app{display:flex;min-height:100vh}
.sb{width:250px;flex:none;background:#0e0e2c;border-right:1px solid var(--l);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;overflow:auto;z-index:50}
.logo{font-weight:800;font-size:1.3rem;padding:4px 10px 18px}.logo i{color:var(--a);font-style:normal}
.nv{display:flex;gap:10px;align-items:center;padding:11px 12px;border-radius:10px;color:#b9bde6;cursor:pointer;border:0;background:none;width:100%;text-align:left;font-size:.93rem}
.nv:hover{background:#171742}.nv.on{background:var(--a);color:#fff}
.main{flex:1;min-width:0;padding:26px;max-width:1180px}
.top{display:none;align-items:center;gap:12px;padding:12px 16px;background:#0e0e2c;border-bottom:1px solid var(--l);position:sticky;top:0;z-index:40}
.top button{background:none;border:0;color:#fff;font-size:1.5rem}
.card{background:linear-gradient(160deg,#16163f,#101033);border:1px solid var(--l);border-radius:16px;padding:20px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.g{display:grid;gap:16px;margin-top:16px}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}

.bt{border:0;border-radius:99px;padding:9px 18px;background:var(--a);color:#fff;cursor:pointer;font-weight:700;font-size:.88rem;display:inline-block}

.lk{cursor:pointer;transition:.2s}.lk:hover{transform:translateY(-3px);border-color:#6366F1}
.rw{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--l);flex-wrap:wrap}.rw:last-child{border:0}
.em{text-align:center;padding:34px 16px;color:var(--m);border:1px dashed var(--l);border-radius:14px}
input,select,textarea{width:100%;padding:11px 13px;margin:5px 0 12px;border-radius:10px;border:1px solid var(--l);background:#0b0b24;color:#fff}
label{font-size:.85rem;color:var(--m);display:block}textarea{min-height:90px}
.cc{width:100%;border-radius:10px;background:#1b1b4d;aspect-ratio:1.414;object-fit:cover;display:block;margin-bottom:10px}

</style></head><body>

<script>
const sb=supabase.createClient("https://zrebikqvjbvuwbzcunkw.supabase.co","sb_publishable_DszdaPjNPM3i0UbGX3lLjQ_DTjdfLcW");
const $=q=>document.querySelector(q);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let U,P,D={},cur="home",editId=null,ADMIN=false;

async function cert(c){
 await document.fonts.load("800 60px Inter");
 const W=1600,H=1131,k=document.createElement("canvas");k.width=W;k.height=H;const x=k.getContext("2d");
 const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,"#0F0E26");g.addColorStop(1,"#2a2578");x.fillStyle=g;x.fillRect(0,0,W,H);
 x.strokeStyle="#818cf8";x.lineWidth=6;x.strokeRect(50,50,W-100,H-100);x.lineWidth=2;x.strokeRect(72,72,W-144,H-144);
 x.textAlign="center";
 const T=(t,y,s,w,col)=>{x.fillStyle=col;do{x.font=`${w} ${s}px Inter,sans-serif`;s-=2}while(x.measureText(t).width>1300&&s>20);x.fillText(t,W/2,y)};
 T("MINDOVA",190,64,800,"#a5b4fc");T("SERTIFIKAT",360,120,800,"#fff");
 T("Ushbu sertifikat quyidagi shaxsga topshiriladi",450,34,400,"#c7cbf5");
 T(nm(),600,92,800,"#fff");T(c.title,700,44,700,"#a5b4fc");
 if(c.event_title)T(c.event_title+" tadbirida ishtirok etgani uchun",770,34,400,"#c7cbf5");
 T("Berilgan sana: "+fd(c.issued_at),930,30,400,"#c7cbf5");T("Sertifikat raqami: "+c.code,980,26,400,"#8b90c8");
 T("Fikrla. Muloqot qil. Yarat.",1040,26,500,"#6366F1");
 return k.toDataURL("image/jpeg",.92);
}
async function zoom(i){$("#mi").src=await cert(D.cert[i]);$("#md").classList.add("on")}
async function pdf(i){const c=D.cert[i],u=await cert(c),d=new window.jspdf.jsPDF({orientation:"landscape",unit:"pt",format:"a4"});d.addImage(u,"JPEG",0,0,841.89,595.28);d.save("MINDOVA-sertifikat-"+c.code+".pdf")}
function fill(){document.querySelectorAll("img[data-ci]").forEach(im=>cert(D.cert[im.dataset.ci]).then(u=>im.src=u))}
const certCard=(c,i)=>`<div class="card"><img class="cc" data-ci="${i}" alt=""><b>${esc(c.title)}</b><p class="m">${esc(c.event_title||"")} · ${fd(c.issued_at)} <span class="b green">Tasdiqlangan</span></p><div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><button class="bt o" onclick="zoom(${i})">🔍 Kattalashtirish</button><button class="bt" onclick="pdf(${i})">⬇ PDF yuklab olish</button></div></div>`;
const NO_CERT="Sizda hozircha sertifikatlar yo‘q. Yangi sertifikatlar berilganda shu yerda paydo bo‘ladi.";

const V={
home(){
 const now=new Date(),em=evM(),om=opM(),mine=new Set(D.reg.map(r=>r.event_id)),myEv=D.reg.filter(r=>r.event_id&&em[r.event_id]);
 const up=D.ev.filter(e=>e.starts_at&&new Date(e.starts_at)>=now).slice(0,3);
 const act=[...myEv.map(r=>({t:"Tadbirga yozildingiz: "+em[r.event_id].title,d:r.created_at})),...D.job.map(j=>({t:"Ishga ariza topshirdingiz: "+(om[j.opportunity_id]?.title||"e’lon"),d:j.created_at})),...D.cert.map(c=>({t:"Sertifikat berildi: "+c.title,d:c.created_at}))].sort((a,b)=>new Date(b.d)-new Date(a.d)).slice(0,5);
 return `<h1>Xush kelibsan, ${esc(nm().split(" ")[0])}! 👋</h1><p class="m">Mindova — imkoniyatlar, yangi tanishuvlar va kelajakka yo‘l ochadigan platforma.</p>
<div class="g g2"><div class="card pc">${av()}<div><h2>${esc(nm())}</h2><span class="b">Mindova a’zosi · ${fd(P.created_at)}</span><p class="m" style="margin:8px 0">📍 ${esc(P.city||"Shahar ko‘rsatilmagan")}<br>✉️ ${esc(U.email)}<br>📞 ${esc(P.phone||"Telefon kiritilmagan")}</p><button class="bt o" onclick="go('prof')">✏️ Profilni tahrirlash</button></div></div>
<div class="card"><h3>📊 Mening faoliyatim</h3><div class="st"><div><b>${D.job.length}</b><span class="m">Arizalar</span></div><div><b>${myEv.length}</b><span class="m">Tadbirlar</span></div><div><b>${D.cert.length}</b><span class="m">Sertifikatlar</span></div></div></div></div>
<div class="g g3"><div class="card lk" onclick="go('apps')"><h3>💼 Mening arizalarim</h3><p class="m">Ishga yuborgan arizalaringiz holati</p></div><div class="card lk" onclick="go('evs')"><h3>🗓 Mening tadbirlarim</h3><p class="m">Ro‘yxatdan o‘tgan tadbirlaringiz</p></div><div class="card lk" onclick="go('certs')"><h3>🎓 Sertifikatlarim</h3><p class="m">Sizga berilgan sertifikatlar</p></div><div class="card lk" onclick="go('port')"><h3>📁 Portfolio</h3><p class="m">Loyiha, ko‘nikma va yutuqlaringiz</p></div></div>
<div class="g g2"><div class="card"><h3>🗓 Yaqinlashayotgan tadbirlar</h3>${up.length?up.map(e=>`<div class="rw"><div class="ev">${safe(e.image_url)?`<img src="${esc(safe(e.image_url))}" alt="">`:""}<div><b>${esc(e.title)}</b><p class="m">${fd(e.starts_at)} ${e.location?"· "+esc(e.location):""}</p></div></div>${mine.has(e.id)?`<span class="b green">Ro‘yxatdan o‘tgansiz</span>`:e.registration_open?`<a class="bt" href="/#royxat">Ro‘yxatdan o‘ting</a>`:""}</div>`).join(""):empty("Yaqin tadbirlar yo‘q.")}</div>
<div class="card"><h3>📄 So‘nggi arizalarim</h3>${D.job.length?D.job.slice(0,3).map(j=>`<div class="rw"><b>${esc(om[j.opportunity_id]?.title||"E’lon")}</b>${badge(j.status)}</div>`).join(""):empty("Hozircha arizalar yo‘q.")}</div></div>
<div class="g g2"><div class="card"><h3>🎓 So‘nggi sertifikatlar</h3>${D.cert.length?D.cert.slice(0,2).map((c,i)=>certCard(c,i)).join(""):empty(NO_CERT)}</div>
<div class="card"><h3>⚡ So‘nggi faoliyatlar</h3>${act.length?act.map(a=>`<div class="rw"><span>${esc(a.t)}</span><span class="m">${fd(a.d)}</span></div>`).join(""):empty("Faoliyat hali yo‘q.")}<div style="margin-top:14px"><a class="bt" href="/#imkoniyatlar">Yangi imkoniyatlarni ko‘rish →</a></div></div></div>`},
prof(){return `<h1>Profilim</h1><form class="card" style="margin-top:16px;max-width:640px" onsubmit="saveP(event)"><div class="pc" style="margin-bottom:14px">${av()}<div><label>Profil rasmi<input type="file" accept="image/*" onchange="upAv(this)" style="margin-bottom:0"></label></div></div>
<label>Ism va familiya<input name="fn" maxlength="80" value="${esc(P.full_name)}" required></label><label>Email<input value="${esc(U.email)}" disabled></label>
<label>Telefon raqami<input name="ph" type="tel" maxlength="20" value="${esc(P.phone)}"></label><label>Shahar<input name="ct" maxlength="60" value="${esc(P.city)}"></label>
<label>O‘zingiz haqingizda<textarea name="bio" maxlength="500">${esc(P.bio)}</textarea></label><label>Qiziqishlar va ko‘nikmalar (vergul bilan)<input name="it" maxlength="200" value="${esc(P.interests)}"></label>
${P.interests?`<p style="margin-bottom:12px">${P.interests.split(",").map(s=>s.trim()).filter(Boolean).map(s=>`<span class="b">${esc(s)}</span> `).join("")}</p>`:""}
<button class="bt">Saqlash</button> <span id="pm" class="ok"></span></form>`},
apps(){const om=opM();return `<h1>Mening arizalarim</h1><div class="card" style="margin-top:16px">${D.job.length?D.job.map(j=>`<div class="rw"><div><b>${esc(om[j.opportunity_id]?.title||"E’lon")}</b><p class="m">${esc(om[j.opportunity_id]?.category||"")} · ${fd(j.created_at)}</p></div>${badge(j.status)}</div>`).join(""):empty("Siz hali ishga ariza topshirmagansiz. Saytdagi “Dolzarb imkoniyatlar” bo‘limidan ariza topshiring.")}</div>`},
evs(){const em=evM(),now=new Date(),L=D.reg.filter(r=>r.event_id&&em[r.event_id]);return `<h1>Mening tadbirlarim</h1><div class="card" style="margin-top:16px">${L.length?L.map(r=>{const e=em[r.event_id],past=e.starts_at&&new Date(e.starts_at)<now;return `<div class="rw"><div><b>${esc(e.title)}</b><p class="m">${fd(e.starts_at)} ${e.location?"· 📍 "+esc(e.location):""}</p></div><div><span class="b ${past?"":"green"}">${past?"Yakunlangan":"Ro‘yxatdan o‘tgansiz"}</span> <button class="bt o" onclick="this.parentNode.parentNode.nextElementSibling.hidden=!this.parentNode.parentNode.nextElementSibling.hidden">Tafsilotlar</button></div></div><p class="m" hidden style="padding:8px 0">${esc(e.description||"Tavsif yo‘q.")}</p>`}).join(""):empty("Siz hali tadbirga ro‘yxatdan o‘tmagansiz. Tizimga kirgan holda tadbirga yoziling.")}</div>`},
certs(){return `<h1>Mening sertifikatlarim</h1>${D.cert.length?`<div class="g g2">${D.cert.map(certCard).join("")}</div>`:`<div class="card" style="margin-top:16px">${empty(NO_CERT)}</div>`}`},
port(){const it=D.pf.find(x=>x.id===editId)||{};return `<h1>Portfolio</h1><div class="g g2"><form class="card" onsubmit="savePf(event)"><h3>${editId?"Tahrirlash":"Yangi qo‘shish"}</h3><label>Turi<select name="k">${["loyiha","ko‘nikma","yutuq"].map(k=>`<option ${it.kind===k?"selected":""}>${k}</option>`).join("")}</select></label><label>Nomi<input name="t" maxlength="100" value="${esc(it.title)}" required></label><label>Tavsif<textarea name="d" maxlength="500">${esc(it.description)}</textarea></label><label>Havola (ixtiyoriy)<input name="l" maxlength="300" placeholder="https://" value="${esc(it.link)}"></label><button class="bt">Saqlash</button>${editId?` <button type="button" class="bt o" onclick="editId=null;go('port')">Bekor</button>`:""}</form>
<div class="card"><h3>Mening ishlarim</h3>${D.pf.length?D.pf.map(p=>`<div class="rw"><div><span class="b">${esc(p.kind)}</span> <b>${esc(p.title)}</b><p class="m">${esc(p.description||"")} ${safe(p.link)?`<a href="${esc(safe(p.link))}" target="_blank" rel="noopener" style="color:#a5b4fc">havola ↗</a>`:""}</p></div><div><button class="bt o" onclick="editId='${p.id}';go('port')">✏️</button> <button class="bt r" onclick="delPf('${p.id}')">🗑</button></div></div>`).join(""):empty("Portfolio hozircha bo‘sh.")}</div></div>`},
set(){return `<h1>Sozlamalar</h1><div class="g g2"><form class="card" onsubmit="savePw(event)"><h3>🔒 Parolni o‘zgartirish</h3><label>Yangi parol (kamida 6 belgi)<input type="password" name="pw" minlength="6" required></label><button class="bt">Parolni yangilash</button> <span id="sm" class="ok"></span></form>
<div class="card"><h3>👤 Profil</h3><p class="m" style="margin-bottom:12px">Ma’lumotlaringizni “Profilim” bo‘limida tahrirlaysiz.</p><button class="bt o" onclick="go('prof')">Profilga o‘tish</button><h3 style="margin-top:22px">🔔 Bildirishnomalar</h3><p class="m">Yangiliklar hozircha Telegram kanalimiz orqali beriladi.</p><button class="bt" style="margin-top:22px" onclick="out()">Xavfsiz chiqish</button></div></div>`}};

function go(n){cur=n;document.querySelectorAll(".nv[data-v]").forEach(b=>b.classList.toggle("on",b.dataset.v===n));$("#view").innerHTML=V[n]();$("#sb").classList.remove("open");scrollTo(0,0);fill()}
async function out(){await sb.auth.signOut();location.href="/"}
async function saveP(e){e.preventDefault();const f=e.target,v={full_name:f.fn.value.trim(),phone:f.ph.value.trim(),city:f.ct.value.trim(),bio:f.bio.value.trim(),interests:f.it.value.trim(),updated_at:new Date().toISOString()};
 const {error}=await sb.from("profiles").update(v).eq("id",U.id);
 if(error){$("#pm").textContent="Xato: "+error.message;return}Object.assign(P,v);go("prof");$("#pm").textContent="Saqlandi ✓"}
async function upAv(i){const fl=i.files[0];if(!fl)return;try{const im=await createImageBitmap(fl),s=Math.min(1,512/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);
 const b=await new Promise(r=>c.toBlob(r,"image/jpeg",.85)),p=U.id+"/"+Date.now()+".jpg",u=await sb.storage.from("avatars").upload(p,b,{contentType:"image/jpeg"});if(u.error)throw u.error;
 const url=sb.storage.from("avatars").getPublicUrl(p).data.publicUrl,{error}=await sb.from("profiles").update({avatar_url:url}).eq("id",U.id);if(error)throw error;P.avatar_url=url;go("prof")}catch(e){alert("Rasm yuklanmadi: "+e.message)}}
async function savePf(e){e.preventDefault();const f=e.target,v={kind:f.k.value,title:f.t.value.trim(),description:f.d.value.trim(),link:f.l.value.trim()||null};
 const r=editId?await sb.from("portfolio_items").update(v).eq("id",editId):await sb.from("portfolio_items").insert([v]);
 if(r.error){alert("Xato: "+r.error.message);return}editId=null;await load();go("port")}
async function delPf(id){if(!confirm("O‘chirilsinmi?"))return;const {error}=await sb.from("portfolio_items").delete().eq("id",id);if(error){alert(error.message);return}await load();go("port")}
async function savePw(e){e.preventDefault();const {error}=await sb.auth.updateUser({password:e.target.pw.value});$("#sm").textContent=error?"Xato: "+error.message:"Parol yangilandi ✓";if(!error)e.target.reset()}

async function load(){
 const q=(t,f)=>f(sb.from(t).select("*"));
 const R=await Promise.all([
  q("profiles",x=>x.eq("id",U.id).maybeSingle()),
  q("registrations",x=>x.eq("user_id",U.id).order("created_at",{ascending:false})),
  q("events",x=>x.eq("status","published").order("starts_at",{ascending:true})),
  q("job_applications",x=>x.eq("user_id",U.id).order("created_at",{ascending:false})),
  q("certificates",x=>x.eq("user_id",U.id).order("issued_at",{ascending:false})),
  q("portfolio_items",x=>x.eq("user_id",U.id).order("created_at",{ascending:false})),
  q("opportunities",x=>x)]);
