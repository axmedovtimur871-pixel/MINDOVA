}

</style>

function notifs(){
 const L=[],mon=30*864e5,now=Date.now();
 S.certs.filter(c=>now-new Date(c.issued_at)<mon).forEach(c=>L.push({k:"c"+c.id,t:`Yangi sertifikat: ${c.event_title}`,h:"#certificates"}));
 S.regs.filter(r=>r.status!=="pending"&&now-new Date(r.updated_at||r.created_at)<mon).forEach(r=>{const e=evMap()[r.event_id];L.push({k:"r"+r.id+r.status,t:`${e?e.title:"Ariza"}: ${stTxt("reg",r.status)}`,h:"#events"})});
 S.apps.filter(a=>a.status!=="pending").forEach(a=>{const o=opMap()[a.opportunity_id];L.push({k:"a"+a.id+a.status,t:`${o?o.title:"Ariza"}: ${stTxt("job",a.status)}`,h:"#applications"})});
 return L}
const seenKey=()=>"mnd_seen_"+S.user.id;
function seen(){try{return new Set(JSON.parse(localStorage.getItem(seenKey())||"[]"))}catch{return new Set()}}
function updateBell(){
 const n=notifs(),sn=seen(),un=n.filter(x=>!sn.has(x.k)).length;
 $("#bell").innerHTML=ic("bell",22)+(un?`<span class="dot">${un}</span>`:"");
 $("#notif").innerHTML=n.length?n.map(x=>`<a class="it" href="${x.h}">${esc(x.t)}</a>`).join(""):'<div class="it sub">Hozircha yangi bildirishnoma yo‘q</div>'}
$("#bell").onclick=e=>{e.stopPropagation();const p=$("#notif");$("#menu").hidden=true;p.hidden=!p.hidden;
 if(!p.hidden){try{localStorage.setItem(seenKey(),JSON.stringify(notifs().map(x=>x.k)))}catch{}setTimeout(updateBell,1200)}};
$("#me").onclick=e=>{e.stopPropagation();$("#notif").hidden=true;$("#menu").hidden=!$("#menu").hidden};

function showApp(id){const a=S.apps.find(x=>x.id===id);if(!a)return;const o=opMap()[a.opportunity_id]||{};
 modal(`<h2>${esc(o.title||"E‘lon o‘chirilgan")}</h2>${badge("job",a.status)}${kv([["Tashkilot",o.organization||"Mindova"],["Toifa",o.category],["Yuborilgan",fd(a.created_at)],["Telefon",a.phone],["Telegram",a.telegram_username?"@"+a.telegram_username:""],["Tajriba",a.has_experience?"Bor":"Yo‘q"],["CV",a.cv_path?"Yuklangan":"Yuklanmagan"]])}${o.description?`<p class="sub" style="overflow-wrap:anywhere">${esc(o.description)}</p>`:""}`)}
function showEvent(e,reg){modal(`<h2>${esc(e.title)}</h2>${reg?badge("reg",reg.status):""}${kv([["Sana",e.starts_at?fd(e.starts_at)+", "+ft(e.starts_at):""],["Joy",e.location],["Format",e.format],["Ro‘yxatdan o‘tilgan",reg?fd(reg.created_at):""]])}${e.description?`<p class="sub" style="overflow-wrap:anywhere;white-space:pre-line">${esc(e.description)}</p>`:""}${!reg&&e.registration_open?`<a class="btn" style="margin-top:14px" href="/?event=${encodeURIComponent(e.id)}#royxat">Ro‘yxatdan o‘tish</a>`:""}`)}
function showOpp(o){const u=safe(o.source_url);modal(`<h2>${esc(o.title)}</h2>${kv([["Tashkilot",o.organization],["Toifa",o.category],["Talablar",o.eligibility],["Muddat",o.deadline?fd(o.deadline):""]])}<p class="sub" style="overflow-wrap:anywhere;white-space:pre-line">${esc(o.description)}</p><div class="row" style="margin-top:14px">${u?`<a class="btn" href="${esc(u)}" target="_blank" rel="noopener noreferrer">Rasmiy manba ↗</a>`:""}<a class="btn ghost" href="/#imkoniyatlar">Saytda ko‘rish</a></div>`)}

/* ------------ sertifikat ------------ */
async function certUrl(id,inline){
 const {data,error}=await sb.functions.invoke("certificates",{body:{action:"download",certificate_id:id,inline:!!inline}});
 if(error||!data||!data.url)throw new Error("fail");return data.url}
async function certView(id){const w=window.open("","_blank");try{const u=await certUrl(id,true);if(w)w.location=u;else location.href=u}catch{if(w)w.close();toast("Sertifikatni ochib bo‘lmadi. Qayta urinib ko‘ring.",1)}}
async function certDl(id,btn){if(btn)btn.disabled=true;try{const u=await certUrl(id,false);const a=document.createElement("a");a.href=u;a.rel="noopener";document.body.appendChild(a);a.click();a.remove()}catch{toast("PDF yuklab bo‘lmadi. Qayta urinib ko‘ring.",1)}finally{if(btn)btn.disabled=false}}

/* ------------ profil / portfolio amallari ------------ */
async function prep(file){const img=await createImageBitmap(file);const s=Math.min(1,512/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,"image/jpeg",.85))}
async function uploadAvatar(file){
 if(!/^image\/(jpeg|png|webp)$/.test(file.type))throw new Error("Faqat JPG, PNG yoki WebP rasm");
 const blob=await prep(file);const path=`${S.user.id}/${Date.now()}.jpg`;
 const {error}=await sb.storage.from("avatars").upload(path,blob,{contentType:"image/jpeg"});
 if(error)throw error;return sb.storage.from("avatars").getPublicUrl(path).data.publicUrl}
const list=v=>v.split(",").map(x=>x.trim().slice(0,40)).filter(Boolean).slice(0,30);

async function saveProfile(f){
 const err=f.querySelector(".ferr"),btn=f.querySelector("[type=submit]");err.textContent="";
 const name=f.full_name.value.trim();
 if(name.length<3){err.textContent="Ism va familiyani kiriting";return}
 let phone=f.phone.value.trim()||null;
 if(phone){let d=phone.replace(/\D/g,"");if(d.length===9)d="998"+d;if(!/^998\d{9}$/.test(d)){err.textContent="Telefon raqamni to‘g‘ri kiriting (masalan: 90 123 45 67)";return}phone="+"+d}
 const upd={full_name:name,phone,city:f.city.value.trim()||null,bio:f.bio.value.trim()||null,skills:list(f.skills.value),interests:list(f.interests.value)};
 btn.disabled=true;btn.textContent="Saqlanmoqda…";
 try{
  const file=f.avatar.files[0];if(file)upd.avatar_url=await uploadAvatar(file);
  const {data,error}=await sb.from("profiles").update(upd).eq("id",S.user.id).select().single();
  if(error)throw error;
  S.profile=data;S.edit=false;toast("Profil saqlandi ✓");render();
 }catch(e){err.textContent="Saqlab bo‘lmadi: "+(e.message||"qayta urinib ko‘ring");btn.disabled=false;btn.textContent="Saqlash"}
}
async function saveSkills(arr){const {data,error}=await sb.from("profiles").update({skills:arr}).eq("id",S.user.id).select().single();if(error)throw error;S.profile=data}

document.addEventListener("submit",async e=>{
 const f=e.target;
 if(f.id==="pf"){e.preventDefault();saveProfile(f)}
 else if(f.id==="skf"){e.preventDefault();const v=f.s.value.trim().slice(0,40);if(!v)return;const cur=S.profile.skills||[];
  if(cur.length>=30){f.nextElementSibling.textContent="30 tadan ko‘p bo‘lmaydi";return}
  if(cur.some(x=>x.toLowerCase()===v.toLowerCase())){f.nextElementSibling.textContent="Bu ko‘nikma allaqachon bor";return}
  try{await saveSkills([...cur,v]);render()}catch{toast("Saqlab bo‘lmadi",1)}}
 else if(f.id==="pif"){e.preventDefault();
  const err=f.querySelector(".ferr");err.textContent="";const title=f.elements.title.value.trim();
  if(!title){err.textContent="Nomini kiriting";return}
  let url=f.url.value.trim();if(url&&!safe(url)){err.textContent="Havola https:// bilan boshlanishi kerak";return}
  if(f.start_date.value&&f.end_date.value&&f.end_date.value<f.start_date.value){err.textContent="Tugash sanasi boshlanishdan oldin bo‘lmasin";return}
  const row={kind:S.ptab,title,organization:f.organization.value.trim()||null,description:f.description.value.trim()||null,url:url||null,start_date:f.start_date.value||null,end_date:f.end_date.value||null};
  const b=f.querySelector("[type=submit]");b.disabled=true;
  const {data,error}=await sb.from("portfolio_items").insert([row]).select().single();
  if(error){err.textContent="Saqlab bo‘lmadi: "+error.message;b.disabled=false;return}
  S.port.unshift(data);S.addOpen=false;toast("Saqlandi ✓");render()}
 else if(f.id==="pwf"){e.preventDefault();const err=f.querySelector(".ferr");err.textContent="";
  if(f.p1.value.length<8){err.textContent="Parol kamida 8 belgidan iborat bo‘lsin";return}
  if(f.p1.value!==f.p2.value){err.textContent="Parollar mos kelmadi";return}
  const {error}=await sb.auth.updateUser({password:f.p1.value});
  if(error){err.textContent="O‘zgartirib bo‘lmadi: "+error.message;return}
  f.reset();toast("Parol yangilandi ✓")}
});
document.addEventListener("change",async e=>{
 const t=e.target;
 if(t.id==="cfEv"){S.cf.ev=t.value;render()}
 else if(t.id==="cfSort"){S.cf.sort=t.value;render()}
 else if(t.dataset.nt){const k=t.dataset.nt,val=t.checked;
  const {error}=await sb.from("profiles").update({[k]:val}).eq("id",S.user.id);
  if(error){t.checked=!val;toast("Saqlab bo‘lmadi",1)}else{S.profile[k]=val;toast("Saqlandi ✓")}}
});

document.addEventListener("click",async e=>{
 const b=e.target.closest("[data-act]");if(!b)return;
 const a=b.dataset.act,id=b.dataset.id;
 switch(a){
  case "close":closeModal();break;
  case "app":showApp(id);break;
  case "reg":{const r=S.regs.find(x=>x.id===id);const ev=evMap()[r.event_id];ev?showEvent(ev,r):modal(`<h2>${r.event_id?"Tadbir":"Umumiy ariza"}</h2>${badge("reg",r.status)}${kv([["Ro‘yxatdan o‘tilgan",fd(r.created_at)]])}`);break}
  case "s-ev":{$("#drop").hidden=true;const ev=evMap()[id];if(ev)showEvent(ev,S.regs.find(r=>r.event_id===id));break}
  case "s-op":{$("#drop").hidden=true;const o=opMap()[id];if(o)showOpp(o);break}
  case "cert-view":certView(id);break;
  case "cert-dl":certDl(id,b);break;
  case "edit-profile":S.edit=true;if(location.hash!=="#profile")location.hash="#profile";else render();break;
  case "cancel-edit":S.edit=false;render();break;
  case "ptab":S.ptab=b.dataset.k;S.addOpen=false;render();break;
  case "pf-add":S.addOpen=!S.addOpen;render();break;
  case "pf-del":if(!confirm("O‘chirilsinmi?"))break;{const {error}=await sb.from("portfolio_items").delete().eq("id",id);if(error)toast("O‘chirib bo‘lmadi",1);else{S.port=S.port.filter(x=>x.id!==id);render()}}break;
  case "skill-del":{const sk=[...(S.profile.skills||[])];sk.splice(+b.dataset.i,1);try{await saveSkills(sk);render()}catch{toast("Saqlab bo‘lmadi",1)}break}
  case "reload":b.disabled=true;await loadAll();render();break;
  case "logout":await sb.auth.signOut();location.replace("/");break;
 }
});
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeModal();$("#drop").hidden=true}});
$("#burger").onclick=()=>document.body.classList.add("nav-open");
$("#scrim").onclick=()=>document.body.classList.remove("nav-open");
window.addEventListener("hashchange",()=>{if(location.hash!=="#profile")S.edit=false;route()});

/* ------------ ishga tushirish ------------ */
(async()=>{
 $("#yr").textContent=new Date().getFullYear();
 $("#burger").innerHTML=ic("menu",24);$("#sic").innerHTML=ic("search",18);$("#arr1").innerHTML=ic("arrow",14);
 buildNav();
 const {data}=await sb.auth.getSession();
 if(!data.session){location.replace("/");return}
 S.user=data.session.user;
 sb.auth.onAuthStateChange((ev,s)=>{if(!s)location.replace("/")});
 await loadAll();
 route();
})();
</script>
